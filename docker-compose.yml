# Without a name, Compose names the project after the directory, so a git
# worktree under .claude/worktrees/ would try to create a second
# atlas-wealth-db container and fail on the fixed container_name. Every
# checkout shares this project, its container and its volume.
name: portfolio-manager

services:
  # Local Postgres for development and E2E. Never point local dev at the
  # Supabase project: that database is production.
  #
  # Nothing here may depend on the checkout's path (no bind mounts): Compose
  # recreates the container when the resolved config changes, so a path-
  # dependent setting would restart Postgres under every other checkout.
  # db:setup, db:migrate and scripts/e2e/prepare-database.ts apply
  # scripts/db/init-local.sql instead.
  db:
    image: postgres:17-alpine
    container_name: atlas-wealth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas-local-only
      POSTGRES_DB: atlas_wealth
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - atlas-wealth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_wealth"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The production image. Needs real auth and database settings in
  # .env.docker (README.md › Running the production image), so it only
  # starts with `docker compose --profile app up -d --build --no-deps web`.
  # --no-deps leaves the shared db container running.
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-wealth-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production

volumes:
  atlas-wealth-db:
