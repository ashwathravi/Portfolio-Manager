name: Production monitor

# Launch item i71; the runbook is docs/monitoring.md.
#
# Every half hour: asks production whether it can reach its database
# (/api/health/ready) and whether every scheduled job, the nightly backup
# included, has succeeded on schedule (/api/health/jobs). When something
# fails it opens one issue that mentions the repository's owner, comments
# when what fails changes, and closes the issue once every check passes. The
# run itself fails only when it couldn't check or couldn't keep that issue up
# to date, so an outage notifies once, not every half hour.
#
# Plain Node and no install: scripts/monitor uses only Node's built-ins.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  check:
    # Not on forks: they have neither production nor its issue.
    if: github.repository == 'ashwathravi/Portfolio-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/monitor

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check production
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_MENTION: ${{ github.repository_owner }}
        run: node scripts/monitor/run.mts
